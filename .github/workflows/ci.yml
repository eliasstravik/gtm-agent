name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify vendored skills
        run: pnpm skills:check
      - name: Typecheck
        if: ${{ always() }}
        run: pnpm typecheck
      - name: Test
        if: ${{ always() }}
        run: pnpm test
      - name: Build
        if: ${{ always() }}
        run: pnpm build
